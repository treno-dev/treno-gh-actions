name: Publish provider
description: Zips the docs of a provider and sends them to Treno with the OIDC token of the job.

inputs:
  provider-id:
    description: The id of the provider in Treno
    required: true
  docs:
    description: The folder with the markdown pages of the docs
    default: docs
  treno:
    description: The address of Treno
    default: https://treno.dev
  audience:
    description: What the OIDC token is for, which Treno checks
    default: https://treno.dev

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
      run: node "${{ github.action_path }}/dist/index.js" provider publish
